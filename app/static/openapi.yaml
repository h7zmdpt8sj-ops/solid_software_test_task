openapi: 3.0.3
info:
  title: Shop Payments API
  version: 0.1.0
  description: Starts the payment for a shopping cart and charges the user's saved card.

servers:
  - url: /

paths:
  /carts/{cart_id}/payments:
    post:
      summary: Start the payment for a cart
      operationId: createPayment
      tags: [Payments]
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: The id of the user who is paying.
          schema:
            type: string
            format: uuid
          example: 11111111-1111-1111-1111-111111111111
        - name: cart_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: c1c1c1c1-c1c1-c1c1-c1c1-c1c1c1c1c1c1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: The card was charged and the cart is checked out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "402":
          description: The provider declined the card. The cart stays active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
              example:
                id: 77973471-dc12-4ff7-b519-ef70303b2c43
                cart_id: c1c1c1c1-c1c1-c1c1-c1c1-c1c1c1c1c1c1
                payment_method_id: 11111111-2222-3333-4444-555555555555
                amount: "70.00"
                currency: USD
                status: failed
                failure_reason: card_declined
                created_at: "2026-11-09T10:27:23.243266+00:00"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CartNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

components:
  schemas:
    CreatePaymentRequest:
      type: object
      properties:
        payment_method_id:
          type: string
          format: uuid
          nullable: true
          description: A saved payment method of the user. If missing, the default one is used.
          example: 11111111-2222-3333-4444-555555555555

    Payment:
      type: object
      required:
        - id
        - cart_id
        - payment_method_id
        - amount
        - currency
        - status
        - failure_reason
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: a751016a-0612-4991-8cd6-a3abf044bba9
        cart_id:
          type: string
          format: uuid
          example: c1c1c1c1-c1c1-c1c1-c1c1-c1c1c1c1c1c1
        payment_method_id:
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        amount:
          type: string
          description: Decimal amount as a string, so no precision is lost.
          example: "70.00"
        currency:
          type: string
          example: USD
        status:
          type: string
          enum: [pending, succeeded, failed]
          example: succeeded
        failure_reason:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-11-09T10:26:48.256924+00:00"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    InvalidRequest:
      description: The body is not a JSON object, or payment_method_id is not a UUID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid_request
    Unauthorized:
      description: X-User-Id is missing or is not a UUID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unauthorized
    CartNotFound:
      description: The cart does not exist or belongs to another user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: cart_not_found
    Conflict:
      description: The cart is not active, or it already has a pending or successful payment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            cartNotActive:
              value:
                error: cart_not_active
            paymentAlreadyStarted:
              value:
                error: payment_already_started
    Unprocessable:
      description: The cart is empty, or the payment method was not found for this user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            cartIsEmpty:
              value:
                error: cart_is_empty
            paymentMethodNotFound:
              value:
                error: payment_method_not_found
