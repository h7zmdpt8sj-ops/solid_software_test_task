services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - ./docker/create_test_database.sql:/docker-entrypoint-initdb.d/000_create_test_database.sql:ro
      - ./migrations/001_base_schema.sql:/docker-entrypoint-initdb.d/001_base_schema.sql:ro
      - ./migrations/002_payments.sql:/docker-entrypoint-initdb.d/002_payments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
